server:
  # Bind to all interfaces so mobile devices on the same LAN can reach the API
  address: 0.0.0.0

Spring:
  datasource:
    # Connection URL with common parameters
    url: jdbc:mysql://localhost:3306/rentrix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}          # Environment variable with fallback
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: MySQLHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000                 # 5 minutes
      connection-timeout: 20000            # 20 seconds
      max-lifetime: 1800000                # 30 minutes
      leak-detection-threshold: 60000      # 1 minute

  # -------------------- JPA / Hibernate (MySQL) --------------------
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update                      # Use 'validate' in production
    show-sql: true
    properties:
      hibernate:
        format_sql: false

# --- Dev-only Actuator override ----------------------------------------------
management:
  endpoint:
    health:
      show-details: always

# --- Swagger / OpenAPI (disabled in prod) ------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# will use later
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    # 10 MB