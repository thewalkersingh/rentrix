# =============================================================================
# Development Profile
# =============================================================================
#
# Local Development:
# - MySQL
# - Swagger Enabled
# - SQL Logging Enabled
# - Relaxed Security Settings
#
# Activate:
# SPRING_PROFILES_ACTIVE=dev
#
# =============================================================================

server:
  # Bind to all interfaces so mobile devices on the same LAN can reach the API
  address: 0.0.0.0


# -------------------- Spring Boot --------------------------------------------
spring:

  # -------------------- DataSource (MySQL) -----------------------------------
  datasource:
    # Connection URL with common parameters
    url: jdbc:mysql://localhost:3306/rentrix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MySQLHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000                 # 5 minutes
      connection-timeout: 20000            # 20 seconds
      max-lifetime: 1800000                # 30 minutes
      leak-detection-threshold: 60000      # 1 minute

  # -------------------- JPA / Hibernate (MySQL) ------------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # --------------------  Jackson -------------------------------------------
  jackson:
    time-zone: UTC


# --- Application-specific configuration --------------------------------------
app:
  # --- JWT configuration --------------------------------
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000                # 15 minutes
    refresh-token-expiry-ms: 604800000            # 7 days
    # 10 MB

  # --- CORS --------------------------------
  cors:
    allowed-origins:
      - http://localhost:5173


# --- Logging ----------------------------------------------------------------
logging:
  level:
    root: INFO
    com.rentrix: DEBUG
    # SQL Queries
    org.hibernate.SQL: DEBUG
    # Query Parameters
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: INFO


# --- Dev-only Actuator -------------------------------------------------------
management:
  endpoint:
    health:
      show-details: always


# --- Swagger / OpenAPI -------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true