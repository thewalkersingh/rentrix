server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: rentrix-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  output:
    ansi:
      enabled: always
# --- Actuator (lightweight health & metrics) -------------------------------
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized   # safer default; overridden to 'always' in dev

# --- Logging -----------------------------------------------------------------
logging:

  level:
    root: WARN
    com.rentrix: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR   # ✅ added


app:
  storage:
    s3:
      region: ${AWS_REGION:ap-south-1}
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
      public-bucket: ${AWS_BUCKET:rentrix-media}
      private-bucket: ${AWS_PRIVATE_BUCKET:rentrix-private}
      public-base-url: ${AWS_PUBLIC_URL:}
      max-image-size-bytes: 10485760       # 10 MB
      allowed-image-types:
        - image/jpeg
        - image/png
        - image/webp