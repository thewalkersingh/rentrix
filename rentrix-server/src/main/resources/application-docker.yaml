# =============================================================================
# application-docker.yaml
# Activated via:
#
# SPRING_PROFILES_ACTIVE=docker
#
# For local Docker Compose development only.
# Never use these credentials in production.
# =============================================================================

spring:

  mvc:
    problem-details:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:rentrix}
    username: ${DB_USERNAME:rentrix}
    password: ${DB_PASSWORD:rentrix123}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: RentrixHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  jackson:
    time-zone: UTC

    default-property-inclusion: non_null

# =============================================================================
# Application
# =============================================================================
app:

  jwt:
    secret: ${JWT_SECRET:UtSmryGfnnxJiVHWYYiyyizEOK92De7npIL16owOeaF}

    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

  storage:
    s3:
      region: ${AWS_REGION:ap-south-1}

      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

      public-bucket: ${S3_PUBLIC_BUCKET:rentrix-public}
      private-bucket: ${S3_PRIVATE_BUCKET:rentrix-private}

      public-base-url: ${S3_PUBLIC_BASE_URL:}

# =============================================================================
# Actuator
# =============================================================================
management:

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
      show-components: when_authorized

  health:
    defaults:
      enabled: true

  info:
    env:
      enabled: true

# =============================================================================
# Swagger / OpenAPI
# =============================================================================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    root: INFO
    com.rentrix: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN